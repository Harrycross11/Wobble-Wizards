/* ---------- physics ---------- */
class Pt{
 constructor(x,y,r,inv){this.x=x;this.y=y;this.px=x;this.py=y;this.r=r;this.inv=inv;this.gc=false}
 integrate(){const vx=(this.x-this.px)*0.998,vy=(this.y-this.py)*0.998;this.px=this.x;this.py=this.y;this.x+=vx;this.y+=vy+game.grav*DT*DT}
}
const vel=p=>[(p.x-p.px)/DT,(p.y-p.py)/DT];
const setVel=(p,vx,vy)=>{p.px=p.x-vx*DT;p.py=p.y-vy*DT};
const addVel=(p,vx,vy)=>{p.px-=vx*DT;p.py-=vy*DT};
class Con{
 constructor(a,b){this.a=a;this.b=b;this.len=Math.hypot(b.x-a.x,b.y-a.y)}
 solve(){const a=this.a,b=this.b,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6,k=(d-this.len)/(d*(a.inv+b.inv));a.x+=dx*k*a.inv;a.y+=dy*k*a.inv;b.x-=dx*k*b.inv;b.y-=dy*k*b.inv}
}
function platPush(p,fric){
 for(const pl of game.plats){
  if(pl.falling||pl.gone)continue;
  const l=pl.x-p.r,r=pl.x+pl.w+p.r,t=pl.y-p.r-(fric?1:0),b=pl.y+pl.h+p.r;
  if(p.x<=l||p.x>=r||p.y<=t||p.y>=b)continue;
  const dl=p.x-l,dr=r-p.x,dt=p.y-t,db=b-p.y,m=Math.min(dl,dr,dt,db);
  if(m===dt){
   p.y=pl.y-p.r;
   if(fric){p.gc=true;p.on=pl;const rel=(p.x-p.px)-pl.dx;p.px=p.x-pl.dx-rel*GFR;if(p.y-p.py>0)p.py=p.y}
  }else if(m===db)p.y=b;else if(m===dl)p.x=l;else p.x=r;
 }
}
function platBelow(x,y){let best=null;for(const pl of game.plats)if(!pl.falling&&!pl.gone&&!pl.temp&&x>=pl.x-8&&x<=pl.x+pl.w+8&&pl.y>=y-10&&(!best||pl.y<best.y))best=pl;return best}
function platAtPoint(x,y){for(const pl of game.plats)if(!pl.falling&&!pl.gone&&x>=pl.x&&x<=pl.x+pl.w&&y>=pl.y-4&&y<=pl.y+pl.h+60)return pl;return null}

const pctColor=p=>p<40?'#ffffff':p<80?'#ffe08a':p<120?'#ffab5a':'#ff5a5a';

function castSpell(w,s){

 if(w.power){w.power=false;addText('BIG SPELL!',w.head.x,w.head.y-100,26,'#ffd24a',1)}
 const combo=w.lastSpell&&game.time-w.lastT<1.5?w.lastSpell+'>'+s.k:'';

 if(s.k==='shield'&&w.ctrlType==='player'&&game.match)game.match.shieldCast=true;

 const t=w.tip,fb=(dx,dy)=>game.spells.push({k:'fire',x:t.x,y:t.y,vx:dx*720,vy:dy*720,owner:w,t:0,col,mul,bounce:hasUp(w,'bounce')});

  case 'fire':fb(s.dx,s.dy);if(hasP(w,'fire3')){const a=Math.atan2(s.dy,s.dx)+0.15;fb(Math.cos(a),Math.sin(a))}if(combo==='gust>fire'){const a=Math.atan2(s.dy,s.dx);for(const o of [-0.28,0.28])fb(Math.cos(a+o),Math.sin(a+o));comboName='FIRESTORM!'}sfx.fire();break;

/* ---------- gesture recognition ---------- */
function reversals(R,ax){
 let n=0,dir=0,ext=R[0][ax];
 for(const p of R){
  const v=p[ax];
  if(dir===0){if(v-ext>16){dir=1;ext=v}else if(ext-v>16){dir=-1;ext=v}}
  else if(dir===1){if(v>ext)ext=v;else if(ext-v>16){n++;dir=-1;ext=v}}
  else{if(v<ext)ext=v;else if(v-ext>16){n++;dir=1;ext=v}}
 }
 return n;
}
function recognize(raw){
 if(!raw||raw.length<3)return null;
 const R=[raw[0]];for(const p of raw){const l=R[R.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>=7)R.push(p)}
 if(R.length<3)return null;
 let len=0,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,lo=0,hi=0;
 R.forEach((p,i)=>{if(i)len+=Math.hypot(p.x-R[i-1].x,p.y-R[i-1].y);minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);if(p.y>R[lo].y)lo=i;if(p.y<R[hi].y)hi=i});
 if(len<45)return null;
 const s=R[0],e=R[R.length-1],se=Math.hypot(e.x-s.x,e.y-s.y),bw=maxx-minx,bh=maxy-miny,big=Math.max(bw,bh),n=R.length;
 const cx=(minx+maxx)/2,cy=(miny+maxy)/2;
 let turn=0;for(let i=2;i<n;i++)turn+=wrapA(Math.atan2(R[i].y-R[i-1].y,R[i].x-R[i-1].x)-Math.atan2(R[i-1].y-R[i-2].y,R[i-1].x-R[i-2].x));
 if(Math.abs(turn)>1.55*TAU&&big>50)return{k:'spiral',x:cx,y:cy};
 if(se<0.55*big&&len>2.0*big&&Math.min(bw,bh)>0.45*big)return corners(R)>=3?{k:'square',x:cx,y:cy}:{k:'circle'};
 if(se/len>0.86)return{k:'line',s,e,dx:(e.x-s.x)/se,dy:(e.y-s.y)/se};
 const rx=reversals(R,'x'),ry=reversals(R,'y');
 if(rx>=2||ry>=3)return{k:'zig',s,e};
 const inner=i=>i>n*0.12&&i<n*0.88;
 if(inner(lo)&&R[lo].y-s.y>25&&R[lo].y-e.y>25)return{k:'v',x:R[lo].x,y:R[lo].y};
 if(inner(hi)&&s.y-R[hi].y>25&&e.y-R[hi].y>25)return{k:'caret',s,e};
 if(se/len>0.7)return{k:'line',s,e,dx:(e.x-s.x)/se,dy:(e.y-s.y)/se};
 return null;
}
function corners(R){
 let n=0,cool=0;
 for(let i=3;i<R.length-3;i++){
  if(cool>0){cool--;continue}
  const a1=Math.atan2(R[i].y-R[i-3].y,R[i].x-R[i-3].x),a2=Math.atan2(R[i+3].y-R[i].y,R[i+3].x-R[i].x);
  if(Math.abs(wrapA(a2-a1))>1.0){n++;cool=4}
 }
 return n;
}
const GLYPHN={circle:'Shield',line:'Fireball',zig:'Gust',v:'Lightning',caret:'Blink',square:'Stone Wall',spiral:'Black Hole'};
function spellFromGesture(g,w){
 if(!g)return null;
 switch(g.k){
  case 'circle':return{k:'shield'};
  case 'square':return{k:'wall',x:g.x,y:g.y};
  case 'spiral':return{k:'hole',x:g.x,y:g.y};
  case 'line':return{k:'fire',dx:g.dx,dy:g.dy};
  case 'v':return{k:'bolt',x:g.x};
  case 'caret':return{k:'blink',x:g.e.x,y:g.e.y};
  case 'zig':{let dx=g.e.x-g.s.x,dy=(g.e.y-g.s.y)*0.5;if(Math.abs(dx)<30){dx=w.f;dy=0}const l=Math.hypot(dx,dy)||1;return{k:'gust',dx:dx/l,dy:clamp(dy/l,-0.6,0.4)}}
 }

}

class WizAI{
 constructor(me,L){this.me=me;this.L=L;this.t=rand(0.8,1.6);this.pending=null;this.jumpCD=0}
 update(dt,en){
  const me=this.me,c=me.ctrl;c.move=0;
  if(!me.alive)return;
  const P=me.center(),E=en.center();
  c.aim=Math.atan2(E.y-P.y,E.x-P.x);
  this.t-=dt;this.jumpCD-=dt;
  if(this.pending){this.pending.t-=dt;me.casting=this.pending.s.k;if(this.pending.t<=0){castSpell(me,this.pending.s);this.pending=null;me.casting=null}}
  if(me.hitstun>0.15)return;
  const below=platBelow(P.x,P.y);
  if(!below){
   let best=null,bd=1e9;for(const pl of game.plats){if(pl.gone||pl.falling||pl.temp)continue;const tx=clamp(P.x,pl.x+40,pl.x+pl.w-40),d=Math.hypot(tx-P.x,pl.y-P.y);if(d<bd){bd=d;best={x:tx,y:pl.y}}}
   if(best){
    c.move=Math.sign(best.x-P.x);
    const vy=vel(me.pelvis)[1];
    if(vy>0&&me.jumps>0&&this.jumpCD<=0){c.jumpQ=true;this.jumpCD=0.35}
    else if(me.jumps===0&&vy>80&&me.mana>=COST.blink&&!this.pending&&!game.mut.has('fireonly'))this.pending={t:0.12,s:{k:'blink',x:best.x,y:best.y-70}};
   }
   return;
  }
  if(!this.pending&&me.shieldT<=0&&me.mana>=COST.shield&&!game.mut.has('fireonly'))for(const s of game.spells){
   if(s.k!=='fire'||s.owner===me)continue;
   const dx=P.x-s.x,dy=P.y-s.y;
   if(Math.hypot(dx,dy)<220&&dx*s.vx+dy*s.vy>0&&this.L>0.3&&Math.random()<(this.L-0.3)*0.25){this.pending={t:0.05,s:{k:'shield'}};break}
  }
  const dx=E.x-P.x,ad=Math.abs(dx),dir=Math.sign(dx)||1;
  let want=ad>360?dir:ad<170?-dir:0;
  if(want){const fy=Math.max(me.footL.y,me.footR.y),pl=platBelow(me.pelvis.x+want*70,fy-5);if(!pl||pl.y-fy>60)want=0}
  const pk=this.L>0.25&&game.pickups.find(q=>q.landed&&Math.abs(q.x-P.x)<350&&Math.abs(q.y-Math.max(me.footL.y,me.footR.y))<50);
  if(pk)want=Math.abs(pk.x-P.x)>10?Math.sign(pk.x-P.x):0;
  c.move=want;
  if(me.grounded&&E.y<P.y-130&&Math.random()<0.015)c.jumpQ=true;
  if(this.t<=0&&!this.pending&&en.alive&&en.shieldT<=0){
   this.t=rand(0.9,1.8)*(2-this.L);const wt=1.8-this.L*0.8;
   const r=game.mut.has('fireonly')?1:Math.random(),err=(1-this.L)*0.55*rand(-1,1);
   if(this.L>=0.6&&me.mana>=COST.hole+10&&r<0.12)this.pending={t:0.5*wt,s:{k:'hole',x:E.x,y:E.y}};
   else if(ad<240&&me.mana>=COST.gust&&r<0.35)this.pending={t:0.35*wt,s:{k:'gust',dx:dir,dy:-0.25}};
   else if(en.grounded&&me.mana>=COST.bolt&&r<0.6)this.pending={t:0.45*wt,s:{k:'bolt',x:E.x+(this.L>0.5?vel(en.pelvis)[0]*0.5*this.L:rand(-60,60)*(1-this.L))}};
   else if(me.mana>=COST.fire){const a=Math.atan2(E.y-P.y,E.x-P.x)+err;this.pending={t:0.3*wt,s:{k:'fire',dx:Math.cos(a),dy:Math.sin(a)}}}
  }
 }
}

/* ---------- audio ---------- */
const sfx=(()=>{
 let ac=null,out=null,nb=null,muted=false;
 const init=()=>{if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();out=ac.createGain();out.gain.value=0.5;out.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}};
 const vol=()=>muted?0:(game.match&&game.match.demo?0.2:1);
 const ok=()=>ac&&vol()>0;
 const env=(g,t0,a,pk,dec)=>{g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk),t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec)};
 function noise(t0,dur,type,f,q,pk,a=0.005){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();env(g,t0,a,pk,dur);s.connect(fl);fl.connect(g);g.connect(out);s.start(t0,Math.random()*1.5);s.stop(t0+a+dur+0.05);return fl}
 function tone(t0,type,f0,f1,dur,pk){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=ac.createGain();env(g,t0,0.004,pk,dur);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+dur+0.05)}
 const T=()=>ac.currentTime;
 return{
  init,toggle(){muted=!muted},
  jump(){if(ok())tone(T(),'sine',300,600,0.1,0.12*vol())},
  fire(){if(!ok())return;const t=T();const f=noise(t,0.35,'bandpass',500,1,0.35*vol(),0.02);f.frequency.exponentialRampToValueAtTime(1500,t+0.3);tone(t,'triangle',220,440,0.2,0.1*vol())},
  boom(){if(!ok())return;const t=T();noise(t,0.5,'lowpass',500,0.7,0.6*vol());tone(t,'sine',120,40,0.4,0.5*vol())},
  charge(){if(!ok())return;tone(T(),'sawtooth',200,900,0.5,0.06*vol())},
  zap(){if(!ok())return;const t=T();noise(t,0.3,'highpass',1800,0.7,0.5*vol());tone(t,'square',1400,200,0.25,0.12*vol());noise(t+0.05,0.6,'lowpass',300,0.7,0.4*vol())},
  shield(){if(!ok())return;const t=T();for(const f of [523,659,784])tone(t,'sine',f,0,0.5,0.1*vol())},
  reflect(){if(!ok())return;tone(T(),'sine',1200,2400,0.15,0.2*vol())},
  gust(){if(!ok())return;const t=T();const f=noise(t,0.5,'bandpass',300,0.8,0.4*vol(),0.08);f.frequency.exponentialRampToValueAtTime(1200,t+0.45)},
  blink(){if(!ok())return;const t=T();tone(t,'sine',400,1600,0.18,0.18*vol());tone(t+0.05,'sine',800,2400,0.15,0.1*vol())},
  fizzle(){if(!ok())return;noise(T(),0.2,'highpass',2500,0.7,0.15*vol())},
  hurt(){if(!ok())return;tone(T(),'triangle',300,120,0.15,0.2*vol())},
  ko(){if(!ok())return;const t=T();noise(t,1.2,'lowpass',250,0.7,0.6*vol());tone(t,'sine',90,30,1,0.5*vol());for(const f of [392,523,659])tone(t+0.2,'triangle',f,0,0.8,0.08*vol())},
  win(){if(!ok())return;const t=T();[523,659,784,1047].forEach((f,i)=>tone(t+i*0.12,'triangle',f,0,0.5,0.15*vol()))},
  click(){if(ac&&!muted)tone(T(),'sine',700,0,0.05,0.08)},
  bonk(){if(!ok())return;const t=T();tone(t,'square',520,160,0.12,0.12*vol());tone(t,'sine',180,90,0.15,0.25*vol())},
  combo(){if(!ok())return;const t=T();[659,880,1175].forEach((f,i)=>tone(t+i*0.06,'triangle',f,0,0.35,0.14*vol()))},
  pickup(){if(!ok())return;const t=T();tone(t,'sine',880,1760,0.15,0.18*vol());tone(t+0.08,'sine',1320,0,0.2,0.12*vol())},
  wall(){if(!ok())return;const t=T();noise(t,0.5,'lowpass',200,0.7,0.6*vol());tone(t,'sine',70,40,0.4,0.4*vol())},
  hole(){if(!ok())return;const t=T();tone(t,'sawtooth',300,50,1.8,0.07*vol());const f=noise(t,1.8,'bandpass',900,2,0.2*vol(),0.2);f.frequency.exponentialRampToValueAtTime(120,t+1.8)},
  crumble(){if(!ok())return;const t=T();noise(t,0.8,'lowpass',350,0.6,0.5*vol());for(let i=0;i<4;i++)tone(t+i*0.1,'triangle',rand(90,160),50,0.15,0.15*vol())},
  roar(){if(!ok())return;const t=T();const f=noise(t,1.2,'bandpass',220,1.2,0.5*vol(),0.15);f.frequency.exponentialRampToValueAtTime(90,t+1.2);tone(t,'sawtooth',120,55,1,0.1*vol())},
  wind(){if(!ok())return;const t=T();const f=noise(t,3.5,'bandpass',500,0.6,0.3*vol(),0.6);f.frequency.exponentialRampToValueAtTime(1100,t+2)},
 };
})();

function drawIsland(pl){

  g.fillStyle='#8a8078';g.fillRect(pl.x,pl.y,pl.w,pl.h);g.fillStyle='#a89e94';g.fillRect(pl.x+4,pl.y,8,pl.h);

  g.fillStyle='#b8aea4';g.fillRect(pl.x-4,pl.y-6,pl.w+8,8);g.globalAlpha=1;return;
 }
 g.save();
 const sh=(pl.shake>0?pl.shake*10:0)+(pl.load||0)*4;if(sh)g.translate(rand(-1,1)*sh,rand(-1,1)*sh*0.5);

 g.strokeStyle=w.trim;g.lineWidth=4;g.beginPath();g.moveTo(hA.x,hA.y);g.lineTo(hB.x,hB.y);g.stroke();
 g.lineWidth=3;g.beginPath();g.moveTo(p.x+px*10,p.y+py*10);g.lineTo(p.x-px*10,p.y-py*10);g.stroke();
 const h=w.head,tilt=Math.atan2(h.x-n.x,n.y-h.y);

/* ---------- update / flow ---------- */
function update(dt){
 game.time+=dt;
 let sc=1;if(game.slowT>0){game.slowT-=dt;sc=0.3}else if(stroke)sc=hasR(player(),'hourglass')?0.15:0.3;
 const sdt=dt*sc,Z=game.wizards;
 for(let i=0;i<Z.length;i++){
  const w=Z[i],e=Z.length>1?Z[1-i]:null;w.enemy=e;
  if(game.cd>0||game.ended||(game.match&&game.match.done)){w.ctrl.move=0;w.ctrl.jumpQ=false;if(w.ctrlType==='player')w.ctrl.aim=Math.atan2(mouse.y-w.neck.y,mouse.x-w.neck.x);continue}
  if(w.ai&&e)w.ai.update(sdt,e);else if(w.ctrlType==='player')readInput(w);
 }
 if(game.respawnT>0){game.respawnT-=dt;if(game.respawnT<=0)respawnPlayer()}
 if(game.nextEnemyT>0){game.nextEnemyT-=dt;if(game.nextEnemyT<=0)spawnWaveEnemy()}
 for(let i=toasts.length-1;i>=0;i--){toasts[i].t+=dt;if(toasts[i].t>3.5)toasts.splice(i,1)}
 if(stroke){stroke.t+=dt;if(stroke.t>2.2||!canDraw())endStroke()}
 game.acc+=sdt;let n=0;while(game.acc>=DT&&n<10){step();game.acc-=DT;n++}if(n>=10)game.acc=0;
 const fx=game.fx;
 for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.vy+=p.g*sdt;p.x+=p.vx*sdt;p.y+=p.vy*sdt;p.life-=sdt;if(p.life<=0){fx[i]=fx[fx.length-1];fx.pop()}}
 for(let i=fading.length-1;i>=0;i--){fading[i].t-=dt;if(fading[i].t<=0)fading.splice(i,1)}
 for(let i=game.texts.length-1;i>=0;i--){const t=game.texts[i];t.t+=dt;t.y-=30*dt;if(t.t>=t.life)game.texts.splice(i,1)}
 updatePickups(sdt);updateHazards(sdt);
 if(game.zoom){game.zoom.t+=dt;if(game.zoom.t>1.9)game.zoom=null}
 game.shake*=Math.exp(-dt*9);
 game.cd-=dt;if(game.hintT>0&&game.cd<0)game.hintT-=dt;
 if(game.ended&&!(game.match&&game.match.done)){game.endT-=dt;if(game.endT<=0){game.ended=false;roundOver(game.winner)}}
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!game.paused)update(dt);render();requestAnimationFrame(loop)}

function loadLayout(L){
 game.layout=L;game.ptime=0;
 game.plats=L.plats.map(p=>Object.assign({},p,{x0:p.x,y0:p.y,dx:0,load:0,shake:0,fade:0,jag:Array.from({length:9},()=>rand(-14,14)),vines:Array.from({length:Math.max(2,p.w/90|0)},()=>rand(0.1,0.9))}));
}
function startMatch(m){game.match=m;m.score=[0,0];m.round=1;startRound()}
function startRound(){
 const m=game.match;
 game.mut=new Set(m.muts||[]);game.grav=game.mut.has('lowgrav')?GRAV*0.5:GRAV;
 if(m.boss)loadLayout(BOSS_LAYOUTS[m.boss]);
 else if(m.layout!=null)loadLayout(LAYOUTS[m.layout]);
 else{let li=Math.floor(Math.random()*LAYOUTS.length);if(game.layout&&LAYOUTS[li]===game.layout)li=(li+1)%LAYOUTS.length;loadLayout(LAYOUTS[li])}
 const sp=game.layout.spawn,yA=platBelow(sp[0],0).y,yB=platBelow(sp[1],0).y;
 const A=new Wizard(m.a,sp[0],yA,1),B=m.b?new Wizard(m.b,sp[1],yB,-1):null;
 if(m.a.ctrl==='ai')A.ai=new WizAI(A,m.a.ai);
 if(B&&m.b.ctrl==='ai')B.ai=new WizAI(B,m.b.ai);
 if(!m.demo)for(const w of [A,B])if(w&&w.ctrlType==='player')applyPlayerMods(w);
 game.wizards=B?[A,B]:[A];
 const hpMul=[0.75,0.9,1.1][save.diff]*(m.bossHp||1);game.boss=m.boss==='golem'?new Golem(game.plats[0],880,hpMul):m.boss==='serpent'?new Serpent(hpMul):m.boss==='lich'?new Lich(hpMul):m.boss==='titan'?new Titan(hpMul):null;
 if(game.mut.has('sudden'))for(const w of game.wizards)w.pct=100;
 game.respawnT=0;game.nextEnemyT=0;game.spells=[];game.fx=[];game.texts=[];stroke=null;fading=[];
 game.pickups=[];game.pickT=rand(5,8);game.dragon=null;game.dragonT=rand(5,8);game.wind=null;game.windT=rand(6,9);game.zoom=null;
 game.hazard=m.noHazard||m.boss||m.survival?'none':Math.random()<0.4?'none':pick(['crumble','dragon','wind']);
 if(game.mut.has('wind')){game.hazard='wind';game.windT=0.5}
 if(game.hazard==='crumble'){let any=false;for(const pl of game.plats)if(pl.w<=240&&!pl.mv&&Math.abs(pl.x+pl.w/2-sp[0])>60&&Math.abs(pl.x+pl.w/2-sp[1])>60){pl.crumble=true;any=true}if(!any)game.hazard='dragon'}
 game.cd=m.demo?0.3:1.4;game.ended=false;game.slowT=0;game.acc=0;game.hintT=!m.demo&&m.round===1?7:0;game.paused=false;game.jumpQ=false;
}
function roundOver(w){
 const m=game.match;if(!m||m.done)return;
 if(m.demo){startRound();return}
 if(m.boss){m.done=true;m.onEnd(w===0);return}
 if(w===0&&!m.survival){const P=game.wizards[0];if(P.pct>=120)grant('comeback');if(Math.round(P.pct)===0&&!game.mut.has('sudden'))grant('flawless')}
 m.score[w]++;
 if(m.score[w]>=m.firstTo){m.done=true;sfx.win();m.onEnd(w===0);return}

 toggleMut(k){if(!MUTS[k])return;const i=save.muts.indexOf(k);if(i>=0)save.muts.splice(i,1);else save.muts.push(k);persist();screenDuelSetup()},
};
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;sfx.init();sfx.click();const f=ACTIONS[b.dataset.a];if(f)f(b.dataset.v,b)});

screenTitle();
if(DEBUG){
 const fl=location.hash.match(/floor=(\d+)/);if(fl)save.floor=+fl[1];
 const mu=location.hash.match(/muts=([\w.]+)/);if(mu)save.muts=mu[1].split('.').filter(k=>MUTS[k]);
 const du=location.hash.match(/mp=(\d+)/);if(du)save.mp=+du[1];
 const m=location.hash.match(/debug=([\w+]+)/);if(m)for(const a of m[1].split('+'))if(ACTIONS[a])ACTIONS[a]();
 if(/rectest/.test(location.hash)){
  const jit=a=>a.map(p=>({x:p.x+rand(-3,3),y:p.y+rand(-3,3)}));
  const path=(pts,n=12)=>{const o=[];for(let i=0;i<pts.length-1;i++)for(let k=0;k<n;k++){const t=k/n;o.push({x:pts[i].x+(pts[i+1].x-pts[i].x)*t,y:pts[i].y+(pts[i+1].y-pts[i].y)*t})}o.push(pts[pts.length-1]);return jit(o)};
  const circ=(r,a0=0,sweep=TAU)=>jit(Array.from({length:40},(_,i)=>({x:300+Math.cos(a0+i/39*sweep)*r,y:300+Math.sin(a0+i/39*sweep)*r*0.9})));
  const tests={
   line_right:path([{x:100,y:300},{x:300,y:280}]),line_up:path([{x:200,y:400},{x:230,y:200}]),line_short:path([{x:100,y:100},{x:160,y:100}],6),
   v:path([{x:100,y:100},{x:160,y:220},{x:220,y:100}]),v_lopsided:path([{x:100,y:150},{x:140,y:230},{x:260,y:120}]),
   caret:path([{x:100,y:250},{x:160,y:120},{x:220,y:250}]),caret_long:path([{x:100,y:300},{x:200,y:150},{x:420,y:260}]),
   circle:circ(70),circle_overlap:circ(60,0,TAU*1.1),circle_open:circ(60,0.3,TAU*0.85),square:path([{x:100,y:100},{x:240,y:100},{x:240,y:230},{x:100,y:230},{x:100,y:104}]),square_small:path([{x:100,y:100},{x:170,y:104},{x:168,y:170},{x:102,y:168},{x:100,y:106}],8),spiral:jit(Array.from({length:80},(_,i)=>({x:300+Math.cos(i/79*TAU*2.2)*(8+i*1.1),y:300+Math.sin(i/79*TAU*2.2)*(8+i*1.1)}))),
   z:path([{x:100,y:100},{x:250,y:100},{x:100,y:220},{x:250,y:220}]),zig4:path([{x:100,y:200},{x:150,y:120},{x:200,y:200},{x:250,y:120},{x:300,y:200}]),
  };
  const out=Object.entries(tests).map(([k,v])=>`${k} -> ${(recognize(v)||{k:'null'}).k}`).join('\n');
  const p=document.createElement('pre');p.style.cssText='position:fixed;right:0;top:0;color:#0f0;background:#000;z-index:9;margin:0;font-size:16px';p.textContent=out;document.body.appendChild(p);
 }
 if(/castfire/.test(location.hash)){for(let j=0;j<120;j++)update(1/60);for(let i=0;i<4;i++){const p=player();if(!p)break;p.mana=100;p.castCD=0;p.hitstun=0;castSpell(p,{k:i%2?'bolt':'fire',dx:1,dy:-0.1,x:game.boss?game.boss.cx():600});for(let j=0;j<70;j++)update(1/60)}}
 const go=location.hash.match(/go=(\d:\d)/);if(go)goNode(go[1]);
 if(/openshop/.test(location.hash)&&save.run){save.run.coins=60;screenShop()}
 if(/openevent/.test(location.hash)&&save.run){save.run.event='tome';screenMystery()}
 if(/openrelic/.test(location.hash)&&save.run)screenRelicPick('Elite spoils','Choose one.');
 const bs=location.hash.match(/boss=(\w+)/);if(bs){startMatch({a:Object.assign(playerCfg(),{ctrl:'player'}),boss:bs[1],lives:3,firstTo:1,label:'Test',onEnd:()=>{}});hideUI()}
 if(/forcewin/.test(location.hash)&&game.match&&game.match.onEnd)game.match.onEnd(true);
 if(/forcelose/.test(location.hash)&&game.match&&game.match.onEnd)game.match.onEnd(false);
 if(/showhist/.test(location.hash))screenHistory();
 if(/clicknode/.test(location.hash)){const n=document.querySelector('[data-a="goNode"] circle:last-of-type');const p=document.createElement('pre');p.style.cssText='position:fixed;right:0;top:0;color:#0f0;background:#000;z-index:9';p.textContent='node found: '+!!n+' dataset: '+(n&&n.closest('[data-a]')&&JSON.stringify(n.closest('[data-a]').dataset));document.body.appendChild(p);if(n){const r=n.getBoundingClientRect(),hit=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);p.textContent+=' | at point: '+(hit&&hit.tagName)+' '+(hit&&hit.id)+' '+(hit&&hit.className&&hit.className.baseVal!==undefined?hit.className.baseVal:hit&&hit.className);n.dispatchEvent(new MouseEvent('click',{bubbles:true}));p.textContent+=' | after click: '+(game.match&&game.match.run?'IN FIGHT':'still map')}}
 const s=location.hash.match(/sim=(\d+)/);
 if(s){const log=[];for(let i=0;i<+s[1];i++){update(1/60);if(i%60===0)log.push(game.wizards.map(w=>`${w.alive?'A':'D'} x${w.pelvis.x|0} y${w.pelvis.y|0} ${Math.round(w.pct)}% m${w.mana|0} g${w.grounded?1:0}`).join(' | '))}
  const p=document.createElement('pre');p.style.cssText='position:fixed;left:0;bottom:0;color:#0f0;background:rgba(0,0,0,.8);z-index:9;margin:0;font-size:11px';p.textContent=log.slice(-12).join('\n');document.body.appendChild(p)}
}
requestAnimationFrame(loop);
